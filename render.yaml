services:
  - type: web
    name: aerofuel-api
    env: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./aerofuel.db
      - key: AEROFUEL_API_KEY
        sync: false
